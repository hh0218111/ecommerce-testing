<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结算页面</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f5f5}
header{background:#1a1a2e;color:#fff;padding:16px 40px;display:flex;justify-content:space-between}
header h1{font-size:20px}
nav a{color:#ccc;text-decoration:none;margin-left:24px;font-size:14px}
nav a:hover{color:#fff}
.container{max-width:700px;margin:24px auto;padding:0 16px}
.form-section{background:#fff;border-radius:10px;padding:24px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.form-section h3{font-size:16px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #eee}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:4px;font-size:13px;color:#666}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.form-group input.error,.form-group select.error{border-color:#e74c3c}
.form-group .error-msg{color:#e74c3c;font-size:12px;margin-top:3px;display:none}
.form-group .error-msg.show{display:block}
.inline{display:flex;gap:12px}
.inline .form-group{flex:1}
.order-summary{background:#fff;border-radius:10px;padding:24px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.order-summary h3{margin-bottom:16px}
.order-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.order-row.total{border-top:1px solid #eee;margin-top:8px;padding-top:12px;font-size:18px;font-weight:bold;color:#e74c3c}
.submit-btn{width:100%;margin-top:20px;padding:14px;background:#4a6cf7;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.submit-btn:hover{background:#3b5de7}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:999}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:40px;text-align:center;max-width:400px}
.modal-box .icon{font-size:48px;margin-bottom:12px}
.modal-box h2{font-size:20px;margin-bottom:8px;color:#27ae60}
.modal-box p{color:#666;margin-bottom:20px;font-size:14px}
.modal-box button{padding:10px 32px;background:#4a6cf7;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>确认订单</h1>
  <nav><a href="index.html">商品列表</a><a href="cart.html">购物车</a></nav>
</header>
<div class="container">
  <div class="form-section">
    <h3>收货信息</h3>
    <div class="form-group">
      <label>收货人</label>
      <input type="text" id="receiver" placeholder="请输入收货人姓名">
      <div class="error-msg" id="receiver-error">请输入收货人</div>
    </div>
    <div class="form-group">
      <label>手机号</label>
      <input type="text" id="phone" placeholder="请输入手机号">
      <div class="error-msg" id="phone-error">请输入正确的手机号</div>
    </div>
    <div class="form-group">
      <label>详细地址</label>
      <input type="text" id="address" placeholder="请输入详细地址">
      <div class="error-msg" id="address-error">请输入地址</div>
    </div>
    <div class="inline">
      <div class="form-group">
        <label>省份</label>
        <select id="province">
          <option value="">请选择</option>
          <option value="广东">广东</option>
          <option value="四川">四川</option>
          <option value="湖北">湖北</option>
          <option value="浙江">浙江</option>
        </select>
        <div class="error-msg" id="province-error">请选择省份</div>
      </div>
      <div class="form-group">
        <label>支付方式</label>
        <select id="payment">
          <option value="">请选择</option>
          <option value="wechat">微信支付</option>
          <option value="alipay">支付宝</option>
          <option value="card">银行卡</option>
        </select>
        <div class="error-msg" id="payment-error">请选择支付方式</div>
      </div>
    </div>
  </div>

  <div class="order-summary" id="order-summary"></div>
  <button class="submit-btn" id="submit-btn">提交订单</button>
</div>

<div class="modal-overlay" id="success-modal">
  <div class="modal-box">
    <div class="icon">✅</div>
    <h2>订单提交成功</h2>
    <p id="order-id-text">订单编号：ORD20240609001</p>
    <button onclick="document.getElementById('success-modal').classList.remove('show')">确定</button>
  </div>
</div>

<script>
var cart = JSON.parse(localStorage.getItem("cart") || "[]");
var total = cart.reduce(function(s,p){return s+p.price*p.qty}, 0);

var s = document.getElementById("order-summary");
s.innerHTML = "<h3>订单商品</h3>"+
  cart.map(function(p){return "<div class='order-row'><span>"+p.name+" x"+p.qty+"</span><span>$"+(p.price*p.qty)+"</span></div>"}).join("")+
  "<div class='order-row total'><span>合计</span><span id='checkout-total'>$"+total+"</span></div>";

if (total === 0) {
  s.innerHTML += "<p style='color:#e74c3c;margin-top:12px'>购物车为空，请先添加商品</p>";
}

function showError(id) {
  document.getElementById(id).classList.add("error");
  document.getElementById(id+"-error").classList.add("show");
}
function clearError(id) {
  document.getElementById(id).classList.remove("error");
  document.getElementById(id+"-error").classList.remove("show");
}

document.getElementById("submit-btn").addEventListener("click", function() {
  var valid = true;
  var fields = ["receiver","phone","address","province","payment"];
  fields.forEach(function(f){
    var el = document.getElementById(f);
    if (!el.value.trim()) { showError(f); valid = false; }
    else { clearError(f); }
  });

  var phone = document.getElementById("phone").value.trim();
  if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
    showError("phone");
    document.getElementById("phone-error").textContent = "请输入正确的手机号";
    valid = false;
  }

  if (!valid) return;

  document.getElementById("submit-btn").disabled = true;
  document.getElementById("submit-btn").textContent = "提交中...";

  setTimeout(function() {
    document.getElementById("success-modal").classList.add("show");
  }, 1000);
});
</script>
</body>
</html>
