<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物车</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f5f5f5}
header{background:#1a1a2e;color:#fff;padding:16px 40px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px}
nav a{color:#ccc;text-decoration:none;margin-left:24px;font-size:14px}
nav a:hover{color:#fff}
.container{max-width:800px;margin:24px auto;padding:0 16px}
.cart-item{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.cart-item .icon{font-size:32px;width:50px;text-align:center}
.cart-item .info{flex:1}
.cart-item .name{font-size:15px;font-weight:bold;margin-bottom:4px}
.cart-item .price{color:#e74c3c;font-size:14px}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-ctrl button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;font-size:16px}
.qty-ctrl button:hover{background:#f0f0f0}
.qty-ctrl span{min-width:20px;text-align:center;font-size:14px}
.cart-item .remove{background:none;border:none;color:#999;cursor:pointer;font-size:18px}
.cart-item .remove:hover{color:#e74c3c}
.summary{background:#fff;border-radius:10px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,0.06);margin-top:16px}
.summary h3{margin-bottom:16px;font-size:16px}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.summary-row.total{border-top:1px solid #eee;margin-top:8px;padding-top:12px;font-size:18px;font-weight:bold;color:#e74c3c}
.checkout-btn{display:block;width:100%;margin-top:16px;padding:14px;background:#4a6cf7;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.checkout-btn:hover{background:#3b5de7}
.checkout-btn:disabled{background:#ccc;cursor:not-allowed}
.empty{text-align:center;padding:60px 0;color:#999}
.empty .icon{font-size:48px;margin-bottom:12px}
.back-link{display:block;text-align:center;margin-top:16px;color:#4a6cf7;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>购物车</h1>
  <nav>
    <a href="index.html">商品列表</a>
    <a href="cart.html">购物车</a>
    <a href="checkout.html">结算</a>
  </nav>
</header>
<div class="container">
  <div id="cart-items"></div>
  <div id="cart-summary"></div>
  <div class="empty" id="empty-msg">
    <div class="icon">🛒</div>
    <p>购物车是空的</p>
    <a href="index.html" class="back-link">去逛逛</a>
  </div>
</div>

<script>
var cart = JSON.parse(localStorage.getItem("cart") || "[]");

var icons = {1:"🎧",2:"⌨️",3:"🎒",4:"☕",5:"⌚",6:"👜",7:"🔋",8:"🌂"};

function saveCart() { localStorage.setItem("cart",JSON.stringify(cart)); renderCart(); }

window.updateQty = function(id, delta) {
  var item = cart.find(function(p){return p.id===id});
  if (item) { item.qty += delta; if (item.qty <= 0) removeItem(id); else saveCart(); }
};

function removeItem(id) {
  cart = cart.filter(function(p){return p.id!==id});
  saveCart();
}

function renderCart() {
  var el = document.getElementById("cart-items");
  var summary = document.getElementById("cart-summary");
  var empty = document.getElementById("empty-msg");

  if (cart.length === 0) {
    el.innerHTML = "";
    summary.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  var total = 0;
  el.innerHTML = cart.map(function(item,idx){
    total += item.price * item.qty;
    return "<div class='cart-item' data-id='"+item.id+"'>"+
      "<div class='icon'>"+(icons[item.id]||"📦")+"</div>"+
      "<div class='info'><div class='name'>"+item.name+"</div>"+
      "<div class='price'>$"+(item.price*item.qty)+"</div></div>"+
      "<div class='qty-ctrl'>"+
        "<button onclick='updateQty("+item.id+",-1)' aria-label='减少'>-</button>"+
        "<span id='qty-"+item.id+"'>"+item.qty+"</span>"+
        "<button onclick='updateQty("+item.id+",1)' aria-label='增加'>+</button>"+
      "</div>"+
      "<button class='remove' onclick='removeItem("+item.id+")' aria-label='删除'>✕</button>"+
    "</div>";
  }).join("");

  summary.innerHTML = "<div class='summary'><h3>订单摘要</h3>"+
    "<div class='summary-row'><span>商品数量</span><span>"+cart.length+"</span></div>"+
    "<div class='summary-row total'><span>合计</span><span id='total-price'>$"+total+"</span></div>"+
    "<a href='checkout.html'><button class='checkout-btn' id='checkout-btn'>去结算</button></a>"+
    "</div>";
}

renderCart();
</script>
</body>
</html>
